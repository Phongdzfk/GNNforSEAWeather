# v3* stage 2 — 72 h rollouts. Attach the v3_star_r4 output. 5 epochs: v3b's val was still falling after 3.
inherit: v2_star.yaml
run_name: v3_star_r12
train:
  init_from: v3_star_r4/best.pt
  rollout_steps: 12
  grad_checkpoint: true
  batch_size: 1
  lr: 1.0e-5
  epochs: 5
  patience: 2
  max_steps_per_epoch: 3000
